name: pd-gaiaball

# The [gaiaball] abstraction for Pure Data (pd-gaiaball/gaiaball.pd: Pd vanilla only, so one
# platform-independent package; nothing is compiled).
#
#   teste    every push to main and every pull request that touches pd-gaiaball/: the
#            generator must reproduce gaiaball.pd byte for byte, then the e2e and the help
#            tests run in a real Pd (Ubuntu's puredata package).
#   pacote   builds the release files with pd-gaiaball/pacotes/montar.py (the zip, the Deken
#            package, SHA256SUMS.txt, the release notes), installs the zip and the .dek in
#            fresh homes and runs the e2e against each; artifact "pd-gaiaball-pacote".
#   release  only for a pushed tag vX.Y.Z: creates (or refreshes) a DRAFT GitHub Release with
#            those files. A person reviews and publishes it:
#              gh release edit vX.Y.Z --draft=false
#            Uploading to Deken stays manual (pd-gaiaball/PUBLICAR-NO-DEKEN.md).
#
# Run by hand (Actions -> pd-gaiaball -> Run workflow) it builds the artifacts and never
# releases. Path filters are not evaluated for tag pushes, so every v* tag runs it.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['pd-gaiaball/**', 'LICENSE', '.github/workflows/pd-gaiaball.yml']
  pull_request:
    paths: ['pd-gaiaball/**', 'LICENSE', '.github/workflows/pd-gaiaball.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  teste:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: The generator reproduces gaiaball.pd byte for byte
        run: |
          python3 pd-gaiaball/tools/gerar_patch.py
          if ! git diff --exit-code -- pd-gaiaball/gaiaball.pd; then
            echo "::error file=pd-gaiaball/gaiaball.pd::gaiaball.pd is not what tools/gerar_patch.py generates. Edit the generator, run it and commit both files."
            exit 1
          fi

      - name: Install Pd
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends puredata
          PD=$(command -v pd || command -v puredata)
          echo "PD=$PD" >> "$GITHUB_ENV"
          "$PD" -version

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: e2e, gaiaball.pd opened as a patch
        run: node pd-gaiaball/tests/e2e.mjs --pd "$PD"

      - name: e2e, [gaiaball] created as an object
        run: node pd-gaiaball/tests/e2e.mjs --pd "$PD" --objeto

      - name: Help patch (does not take the port until its toggle is on)
        run: |
          node pd-gaiaball/tests/ajuda.mjs --pd "$PD"
          node pd-gaiaball/tests/ajuda.mjs --pd "$PD" --com-objeto

  pacote:
    needs: teste
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install pandoc and Pd
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends pandoc puredata unzip
          PD=$(command -v pd || command -v puredata)
          echo "PD=$PD" >> "$GITHUB_ENV"
          pandoc --version | head -1

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            if ! printf '%s\n' "$REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
              echo "::error::the tag must look like v0.1.0 (got $REF_NAME)"
              exit 1
            fi
            echo "VERSAO=${REF_NAME#v}" >> "$GITHUB_ENV"
            echo "REF=$REF_NAME" >> "$GITHUB_ENV"
          else
            echo "VERSAO=0.0.0-dev" >> "$GITHUB_ENV"
            echo "REF=$GITHUB_SHA" >> "$GITHUB_ENV"
          fi

      - name: Build the zip, the Deken package, the sums and the notes
        run: |
          python3 pd-gaiaball/pacotes/montar.py "$VERSAO" dist --ref "$REF" --deken docker
          ls -l dist
          unzip -l "dist/pd-gaiaball-$VERSAO.zip"
          cat "dist/gaiaball[v$VERSAO].dek.txt"
          (cd dist && sha256sum -c SHA256SUMS.txt)

      - name: Install the zip in a fresh home (~/.local/lib/pd/extra) and run the e2e
        run: |
          home="$RUNNER_TEMP/home-zip"
          mkdir -p "$home/.local/lib/pd/extra" "$RUNNER_TEMP/zip"
          unzip -q "dist/pd-gaiaball-$VERSAO.zip" -d "$RUNNER_TEMP/zip"
          cp -R "$RUNNER_TEMP/zip/gaiaball" "$home/.local/lib/pd/extra/"
          HOME="$home" node pd-gaiaball/tests/e2e.mjs --pd "$PD" --objeto --instalado

      - name: Install the .dek the way Deken does (unzip into the path) and run the e2e
        run: |
          home="$RUNNER_TEMP/home-dek"
          mkdir -p "$home/.local/lib/pd/extra"
          unzip -q "dist/gaiaball[v$VERSAO].dek" -d "$home/.local/lib/pd/extra"
          HOME="$home" node pd-gaiaball/tests/e2e.mjs --pd "$PD" --objeto --instalado

      - uses: actions/upload-artifact@v7
        with:
          name: pd-gaiaball-pacote
          path: dist
          if-no-files-found: error

  release:
    needs: pacote
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pd-gaiaball-pacote
          path: dist

      - name: Create or refresh the DRAFT release (never publishes)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSAO="${TAG#v}"
          TITLE="[gaiaball] $VERSAO para Pure Data"
          FILES=("dist/pd-gaiaball-$VERSAO.zip" "dist/pd-gaiaball-$VERSAO-deken.zip" dist/SHA256SUMS.txt)
          ls -l "${FILES[@]}"
          PRE=()
          case "$VERSAO" in 0.*|*-*) PRE=(--prerelease) ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != true ]; then
              echo "::error::Release $TAG is already published; its files are not replaced. Tag a new version."
              exit 1
            fi
            gh release upload "$TAG" "${FILES[@]}" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file dist/notas-da-versao.md
          else
            gh release create "$TAG" "${FILES[@]}" --draft --verify-tag "${PRE[@]}" \
              --title "$TITLE" --notes-file dist/notas-da-versao.md
          fi
          gh release view "$TAG" --json url,isDraft,isPrerelease,assets \
            --jq '{url, isDraft, isPrerelease, assets: [.assets[].name]}'
