[platformio]
src_dir = Gaiaball
test_dir = test

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@1.4.3

[env:native]
platform = native
test_build_src = yes
test_framework = unity
build_src_filter =
    +<src/logic/>
    -<*.ino>
    -<src/services/>
    -<src/vendor/>
