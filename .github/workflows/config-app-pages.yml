name: config-app-pages

# Publishes the config-app to GitHub Pages (https://gaiasenses.github.io/gaiaball/).
#
# Runs on every push to main that touches the config-app (or this file), so the site
# follows main on its own; it can also be started by hand (Actions tab ->
# config-app-pages -> "Run workflow"). The github-pages environment only accepts
# deployments from main.
on:
  push:
    branches: [main]
    paths: ['config-app/**', '.github/workflows/config-app-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: config-app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: config-app/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          PAGES_BASE: /gaiaball/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: config-app/dist

      - id: deployment
        uses: actions/deploy-pages@v5
